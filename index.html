<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mileage Tracker</title>
<meta name="description" content="Log KM driven per job and date.">
<meta name="theme-color" content="#333333">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mileage">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
  header { background: #333333; color: #fff; padding: 16px 20px; padding-top: calc(16px + env(safe-area-inset-top)); }
  :root { accent-color: #333333; }
  :focus-visible { outline: 2px solid #333333; outline-offset: 2px; }
  header { display: flex; align-items: center; gap: 14px; }
  header .logo { height: 44px; width: auto; display: block; flex: none; }
  header h1 { margin: 0; font-size: 1.3rem; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 12px; align-items: end; }
  label { display: flex; min-width: 0; flex-direction: column; font-size: .85rem; font-weight: 600; gap: 4px; }
  input { padding: 12px; min-height: 48px; border: 1px solid #ccd; border-radius: 8px; font-size: 16px; width: 100%; min-width: 0; background: #fff; color: #222; }
  button { min-height: 48px; padding: 12px 16px; border: 0; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; background: #333333; color: #fff; }
  button.secondary { background: #e7ebf0; color: #222; }
  button.danger { background: transparent; color: #c62828; min-width: 44px; min-height: 44px; padding: 4px 8px; font-size: 1.1rem; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .stat .v { font-size: 1.5rem; font-weight: 700; }
  .stat .l { font-size: .8rem; color: #666; }
  .stat.month { grid-column: 1 / -1; border-bottom: 1px solid #eee; padding-bottom: 12px; }
  .stat.month .v { font-size: 2rem; color: #333333; }
  @media (min-width: 600px) { .stats { grid-template-columns: repeat(4, 1fr); } .stat.month { grid-column: auto; border: 0; padding: 0; } }
  .toolbar { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; margin-bottom: 12px; }
  .toolbar .full { grid-column: 1 / -1; }
  .toolbar label { font-weight: 500; color: #666; font-size: .75rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eee; font-size: .95rem; }
  th { font-size: .8rem; color: #666; text-transform: uppercase; }
  td.km, th.km { text-align: right; }
  td:last-child { width: 44px; padding: 0; }
  .settings { margin-top: 12px; font-size: .9rem; color: #555; }
  .settings summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 6px; list-style: none; }
  .settings summary::-webkit-details-marker { display: none; }
  .settings .row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: end; padding-top: 4px; }
  .settings .hint { font-size: .75rem; color: #888; margin: 6px 0 0; }
  .stat .sub { font-size: .95rem; font-weight: 600; color: #333; }
  .stat.month .sub { font-size: 1.1rem; }
  td.amt, th.amt { text-align: right; white-space: nowrap; }
  td.date { white-space: nowrap; }
  td.job { word-break: break-word; }
  .empty { color: #888; text-align: center; padding: 20px; }
</style>
</head>
<body>
<header><img class="logo" src="icons/clair-logo-white.png" width="38" height="44" alt="Clair"><h1>Mileage Tracker</h1></header>
<main>
  <div class="card">
    <form id="entryForm">
      <label>Date <input type="date" id="date" required></label>
      <label>KM driven <input type="number" id="km" step="0.1" min="0" inputmode="decimal" required></label>
      <label>Job number <input type="text" id="job" autocapitalize="characters" autocomplete="off" required></label>
      <button type="submit">Add trip</button>
    </form>
    <details class="settings" id="settings">
      <summary>⚙ Rate: <strong id="rateSummary">AED 1.00 / KM</strong></summary>
      <div class="row">
        <label>Rate (AED per KM) <input type="number" id="rate" step="0.01" min="0" inputmode="decimal"></label>
        <button type="button" class="secondary" id="saveRate">Save</button>
      </div>
      <p class="hint">New trips use this rate. Trips already logged keep the rate they were added with.</p>
    </details>
  </div>

  <div class="card stats">
    <div class="stat month"><div class="v"><span id="monthKm">0.0</span> km</div><div class="sub" id="monthAed">AED 0.00</div><div class="l" id="monthLabel">This month</div></div>
    <div class="stat"><div class="v" id="totalKm">0.0</div><div class="sub" id="totalAed">AED 0.00</div><div class="l">Total (shown)</div></div>
    <div class="stat"><div class="v" id="tripCount">0</div><div class="l">Trips (shown)</div></div>
    <div class="stat"><div class="v" id="jobCount">0</div><div class="l">Jobs (shown)</div></div>
  </div>

  <div class="card">
    <div class="toolbar">
      <input class="full" type="text" id="filterJob" placeholder="Filter by job number">
      <label>From <input type="date" id="filterFrom"></label>
      <label>To <input type="date" id="filterTo"></label>
      <button class="secondary full" id="exportBtn">Export CSV</button>
    </div>
    <table>
      <thead><tr><th>Date</th><th>Job</th><th class="km">KM</th><th class="amt">Amount</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script>
  const KEY = 'mileageEntries';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; } };
  const save = e => localStorage.setItem(KEY, JSON.stringify(e));
  let entries = load();
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  // Local date (not UTC) so it's correct near midnight in any time zone.
  const localDate = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  $('date').value = localDate();

  // Reimbursement rate (AED per KM). Each trip stores the rate it was logged with.
  const RATE_KEY = 'mileageRate', DEFAULT_RATE = 1;
  const loadRate = () => { const r = parseFloat(localStorage.getItem(RATE_KEY)); return isFinite(r) && r >= 0 ? r : DEFAULT_RATE; };
  let rate = loadRate();
  const tripRate = e => (typeof e.rate === 'number' && isFinite(e.rate)) ? e.rate : rate;
  const cents = e => Math.round(e.km * tripRate(e) * 100);          // per-trip amount in fils, rounded once
  const aed = c => `AED ${(c / 100).toFixed(2)}`;
  const sumCents = list => list.reduce((s, e) => s + cents(e), 0);
  function showRate() { $('rate').value = rate.toFixed(2); $('rateSummary').textContent = `AED ${rate.toFixed(2)} / KM`; }
  showRate();
  $('saveRate').onclick = () => {
    const r = parseFloat($('rate').value);
    if (!isFinite(r) || r < 0) { showRate(); return; }
    rate = Math.round(r * 10000) / 10000;
    localStorage.setItem(RATE_KEY, String(rate));
    showRate(); $('settings').open = false; render();
  };
  $('rate').onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); $('saveRate').click(); } };

  function filtered() {
    const j = $('filterJob').value.trim().toLowerCase();
    const from = $('filterFrom').value, to = $('filterTo').value;
    return entries.filter(e =>
      (!j || e.job.toLowerCase().includes(j)) &&
      (!from || e.date >= from) && (!to || e.date <= to)
    ).sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  }

  function render() {
    const list = filtered();
    const body = $('rows');
    body.innerHTML = list.length ? '' : `<tr><td colspan="5" class="empty">${entries.length ? 'No trips match the filter.' : 'No trips yet.'}</td></tr>`;
    list.forEach(e => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="date"></td><td class="job"></td><td class="km">${e.km.toFixed(1)}</td><td class="amt">${aed(cents(e))}</td><td><button class="danger" title="Delete" aria-label="Delete trip">✕</button></td>`;
      tr.children[0].textContent = e.date;
      tr.children[1].textContent = e.job;
      tr.querySelector('button').onclick = () => {
        if (confirm('Delete this trip?')) { entries = entries.filter(x => x.id !== e.id); save(entries); render(); }
      };
      body.appendChild(tr);
    });
    $('totalKm').textContent = list.reduce((s, e) => s + e.km, 0).toFixed(1);
    $('totalAed').textContent = aed(sumCents(list));
    $('tripCount').textContent = list.length;
    $('jobCount').textContent = new Set(list.map(e => e.job)).size;
    const now = new Date(), month = localDate(now).slice(0, 7);
    const monthList = entries.filter(e => e.date.slice(0, 7) === month);
    $('monthKm').textContent = monthList.reduce((s, e) => s + e.km, 0).toFixed(1);
    $('monthAed').textContent = aed(sumCents(monthList));
    $('monthLabel').textContent = `This month (${now.toLocaleString(undefined, { month: 'long', year: 'numeric' })})`;
  }

  $('entryForm').onsubmit = ev => {
    ev.preventDefault();
    const km = parseFloat($('km').value);
    if (!isFinite(km) || km < 0) return;
    entries.push({ id: Date.now(), date: $('date').value, km, job: $('job').value.trim(), rate });
    save(entries);
    $('km').value = ''; $('job').value = '';
    render();
  };

  ['filterJob', 'filterFrom', 'filterTo'].forEach(id => $(id).oninput = render);

  $('exportBtn').onclick = () => {
    const q = s => `"${String(s).replace(/"/g, '""')}"`;
    const list = filtered();
    const totalKm = Math.round(list.reduce((s, e) => s + e.km, 0) * 10) / 10;
    const csv = ['Date,Job Number,KM,Rate (AED/KM),Amount (AED)']
      .concat(list.map(e => [e.date, q(e.job), e.km, tripRate(e).toFixed(2), (cents(e) / 100).toFixed(2)].join(',')))
      .concat([['Total', '', totalKm, '', (sumCents(list) / 100).toFixed(2)].join(',')])
      .join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = `mileage-${localDate()}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
  };

  // Refresh "this month" if the app stays open across midnight / month change.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(reg => document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); }))
      .catch(() => {}));
  }
</script>
</body>
</html>
